[theme]
base = "dark"
primaryColor = "#F5A623"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#151C24"
textColor = "#E8EEF4"
font = "sans serif"

[server]
headless = true
port = 8502
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
